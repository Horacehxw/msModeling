# op_mapping.yaml — 算子映射表 (CANN 8.5 + vLLM-ascend 0.18.0 + PyTorch 2.9.0)
# 路径: tensor_cast/performance_model/perf_database/data/{device}/vllm_ascend/{version}/op_mapping.yaml
#
# 映射方法论 (遵循 tutorial/OP_PLUGIN_MAPPING_TUTORIAL.md):
#   每条映射遵循完整证据链, 证据写入 notes 字段:
#   路径 A: TC op → torch_npu/aten API → op-plugin YAML → C++ impl → EXEC_NPU_CMD(aclnn*) → Profiling Type
#   路径 B: vLLM-ascend Python → torch_npu.npu_* → op-plugin → aclnn* → Profiling Type
#   路径 C: vLLM-ascend fusion pass → custom kernel → Profiling Type
#
# 数据来源:
#   - TensorCast 注册算子: register_tensor_cast_op (56 ops, tensor_cast/ops/*.py)
#   - pytorch-npu (op-plugin): /Users/horacehxw/Projects/pytorch-npu/ (v7.3.0-pytorch2.9.0)
#   - vLLM-ascend: /Users/horacehxw/Projects/vllm-ascend/ (main (v0.18.0 compatible))
#   - CANN repos: ops-nn, ops-transformer, ops-math (v8.5.0)
#   - Qwen3-32B 0325 Profiling (CANN 8.5, vllm 0.18.0)
#   - DeepSeek-V3 0325 Profiling (CANN 8.5, vllm 0.18.0)
#
# CANN 8.5 vs 8.3 关键变化:
#   - AddRmsNorm → AddRmsNormBias (vllm-ascend v0.15.0 自定义 op, csrc/add_rms_norm_bias/)
#   - ApplyRotaryPosEmb → _triton_rope + split_qkv_rmsnorm_rope_kernel (Triton 融合)
#   - ApplyTopKTopPWithSorted → ApplyTopKTopPCustom (vllm-ascend 自定义 sampling op)
#   - 新增 MatMulV3 (大 M Prefill GEMM, CANN 8.5 新 kernel; Decode 仍用 MatMulV2)
#   - 新增 LinearIndex (ScatterElementsV2 内部子 kernel)
#   - DispatchFFNCombine: vllm-ascend v0.15.0 超级融合 MoE op (csrc/dispatch_ffn_combine/)
#
# vLLM 0.18.0 vs 0.15.0 关键变化:
#   - DSv3 Prefill: RINGMLAPrefillBF16Kernel 消失, 统一为 FusedInferAttentionScore
#   - Qwen3 PF: MatMulV3 仍在 (512x, 大 M Prefill FFN); DC 仅 MatMulV2
#   - 新增 muls_add_kernel: Triton 融合 (MulsAddFusionPass, x*scale+y, MoE routing)
#   - AICPU 控制 kernel: allgatherAicpuKernel, reduce_scatterAicpuKernel 仍在 PF (Qwen3 PF 516x each), DC 不出现
#   - Qwen3 DC: ReshapeAndCacheNdKernel → reshape_and_cache_200000000
#   - DSv3: PagedCacheLoadNdKernel 消失, Muls → muls_add_kernel
#
# DSv3 0319 新增内核 (vs 0316):
#   - 通信模式变化: hcom_reduceScatter_ → hcom_allReduce_ (新数据中 reduceScatter 消失)
#   - 新增 PadV3 / PadV3AiCore (decode padding, 35K+ 次调用)
#   - 新增 MemSet (内存初始化, 35K+ 次)
#   - 新增 allreduceAicpuKernel (AICPU allReduce 变体, 6.6K 次)
#   - 新增 BatchMatMulNd (BMM 变体, 282 次)
#   - 大量 AiCore 加速变体: SliceAiCore, AddAiCore, AscendQuantV2Aicore, TransposeAiCore 等
#   - TransData 消失
#     替代 MoeDistributeDispatchV2 + GroupedMatmul(×2) + SwiGlu + MoeDistributeCombineV2 + Unpermute
#     在 DSv3 profiling 中, 路由专家 FFN 全部由 DispatchFFNCombine 执行, 不再出现 GroupedMatmul

version: "0.18.0"
device: ATLAS_800_A3_752T_128G_DIE
cann_version: "8.5"
pytorch_version: "2.9.0"
op_plugin_version: "7.3.0"
collection_date: "2026-03-27"

communication_data_ref: "../../hccl/v8.5/"
communication_fallback: analytic

interpolation_policy:
  default_method: linear
  kernel_overrides:
    FusedInferAttentionScore:
      shape_transform: sqrt


# ============================================================================
#                         计算算子映射 (operator_mappings)
# ============================================================================

operator_mappings:

  # ========== 1. 标准 aten 算子 ==========

  "aten.mm.default":
    kernel_type: MatMulV2
    alternate_kernel_types: [MatMulV3, MatMulCommon]
    notes: >
      [HIGH] op-plugin: MmKernelNpuOpApi.cpp → aclnnMm (ND) / aclnnMatmulWeightNz (NZ).
      CANN 8.5 kernel dispatch: MatMulV2 (small M, Decode), MatMulV3 (large M, Prefill FFN).
      0325 profiling (re-collected): Qwen3 PF MatMulV2(516x)+MatMulV3(512x); DC MatMulV2(43263x).
      DSv3 PF MatMulV2(1951x), MatMulCommon(29x); DC MatMulV2(3771x).

  "aten.addmm.default":
    kernel_type: MatMulV2
    notes: >
      [MEDIUM] op-plugin: AddmmKernelNpuOpApi.cpp.
      aclnn: aclnnAddmm (ND), aclnnAddmmWeightNz (NZ); 底层 kernel Type 仍为 MatMulV2.
      vLLM 推理中 nn.Linear 通常走 mm (无 bias), addmm 较少出现.

  "aten.bmm.default":
    kernel_type: BatchMatMulV2
    alternate_kernel_types: [TransposeBatchMatMul, BatchMatMulNd]
    notes: >
      [HIGH] op-plugin: BmmKernelNpuOpApi.cpp → aclnnBatchMatMul → BatchMatMulV2.
      Dispatch: transpose_b parameter → TransposeBatchMatMul (MLA attn_output @ W_UV).
      Standard BMM → BatchMatMulV2. 0313 profiling: BatchMatMulV2(305x), TransposeBatchMatMul(305x).

  "aten.embedding.default":
    kernel_type: GatherV2
    alternate_kernel_types: [GatherV3, GatherV2AiCore]
    tc_input_count: 2
    notes: >
      [HIGH] op-plugin: EmbeddingKernelNpuOpApi.cpp → aclnnEmbedding → GatherV2.
      v0.18.0: Decode 模式下 CANN 分派至 GatherV2AiCore. 0325 profiling: Qwen3 DC GatherV2AiCore(191x).
      TC has (weight, indices, ...); NPU CSV has (weight, indices, axis) — tc_input_count=2.

  "aten.index_select.default":
    kernel_type: GatherV3
    alternate_kernel_types: [GatherV2]
    notes: >
      [MEDIUM] op-plugin: IndexSelectKernelNpuOpApi.cpp.
      aclnn: aclnnIndexSelect → GatherV3.

  "aten.convolution.default":
    kernel_type: Conv2D
    notes: >
      [LOW] op-plugin: ConvolutionKernelNpuOpApi.cpp.
      aclnn: aclnnConvolution. LLM 不含卷积层; 仅用于 video/image models.

  "aten.cat.default":
    zero_cost: true
    notes: >
      [HIGH] NPU concat is typically zero-copy view when tensors are contiguous.
      ConcatD appears in 0326 profiling for non-contiguous cases but with negligible latency.
      MoE shared expert path concat is negligible.

  "tensor_cast.cat.default":
    zero_cost: true
    notes: >
      [HIGH] 与 aten.cat.default 相同; NPU concat is zero-copy view.

  "aten.add.Tensor":
    kernel_type: Add
    alternate_kernel_types: [AddAiCore]
    query_mode: elementwise
    notes: >
      [HIGH] op-plugin: AddKernelNpuOpApi.cpp.
      aclnn: aclnnAdd. Profiling: Qwen3 CANN 8.5 Add(30x).
      query_mode=elementwise: output-shape matching with byte-ratio dtype scaling.
      Solves FP32 vs BF16 dtype gap and broadcast pattern ambiguity.

  "aten.to.dtype":
    kernel_type: Cast
    alternate_kernel_types: [TensorMove, CastAiCore]
    notes: >
      [HIGH] op-plugin: CastKernelNpuOpApi.cpp → aclnnCast.
      Dispatch (CANN internal): src_dtype != dst_dtype → Cast; src_dtype == dst_dtype → TensorMove.
      CastAiCore: AiCore-accelerated Cast variant (CANN 8.5+). 0313 profiling: Cast(1613x), CastAiCore(670x).


  # ========== 2. 量化线性 (Quantized Linear) ==========

  "tensor_cast.static_quant_linear.default":
    kernel_type: QuantBatchMatmulV3
    tc_input_count: 2
    notes: >
      [HIGH] op-plugin: WeightQuantBatchMatmulV2KernelNpuOpApi.cpp.
      aclnn: aclnnWeightQuantBatchMatmulV2/V3. W8A8 path.
      TC has (x, weight, scale, ...); NPU CSV has (x, weight_NZ, scale, scale) — tc_input_count=2 for (x, weight).

  "tensor_cast.static_quant_linear_int4.default":
    kernel_type: QuantBatchMatmulV3
    notes: >
      [MEDIUM] op-plugin: npu_weight_quant_batchmatmul / npu_quant_matmul.
      W4A8; INT4 weights packed as INT32.

  "tensor_cast.fp8_linear.default":
    kernel_type: QuantBatchMatmulV3
    notes: >
      [LOW] FP8 matmul; 映射到 QuantBatchMatmulV3 为设计假设, 待 FP8 profiling 验证.

  "tensor_cast.mxfp4_linear.default":
    kernel_type: QuantBatchMatmulV3
    notes: >
      [LOW] MXFP4 matmul; placeholder, 待硬件支持后验证.


  # ========== 3. GroupedMatmul (MoE) ==========

  "tensor_cast.grouped_matmul.default":
    kernel_type: GroupedMatmul
    alternate_kernel_types: [DispatchFFNCombine]
    notes: >
      [HIGH] op-plugin: GroupedMatmulKernelNpuOpApi.cpp.
      aclnn: aclnnGroupedMatmul/V4/V5/WeightNz. BF16 base.
      v0.18.0: DSv3 路由专家 FFN 被 DispatchFFNCombine 吸收 (aclnnDispatchFFNCombineBF16).

  "tensor_cast.grouped_matmul_quant.default":
    kernel_type: GroupedMatmul
    alternate_kernel_types: [DispatchFFNCombine]
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with scale/per_token_scale. W8A8.
      CANN 8.5 aclgraph: 路由专家 down proj 被 DispatchFFNCombine 超级融合吸收.

  "tensor_cast.grouped_matmul_quant_int4.default":
    kernel_type: GroupedMatmul
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with antiquant_scale/offset. W4A8.

  "tensor_cast.grouped_matmul_fp8.default":
    kernel_type: GroupedMatmul
    notes: >
      [HIGH] op-plugin: npu_grouped_matmul with scale, no offset. FP8.

  "tensor_cast.grouped_matmul_mxfp4.default":
    kernel_type: GroupedMatmul
    notes: >
      [MEDIUM] op-plugin: npu_grouped_matmul. MXFP4.


  # ========== 4. GroupedMatmul+SwiGlu 融合 ==========

  "tensor_cast.grouped_matmul_swiglu.default":
    kernel_type: GroupedMatmul
    notes: >
      [MEDIUM] op-plugin: npu_grouped_matmul with act_type parameter. BF16 GMM+SwiGlu.

  "tensor_cast.grouped_matmul_quant_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    alternate_kernel_types: [DispatchFFNCombine]
    notes: >
      [HIGH] op-plugin: GroupedMatmulSwigluQuantNpuOpapi.cpp.
      aclnn: aclnnGroupedMatmulSwigluQuantWeightNZ. W8A8 GMM+SwiGlu+Quant.
      CANN 8.5 aclgraph: 路由专家 FFN 被 DispatchFFNCombine 超级融合吸收.

  "tensor_cast.grouped_matmul_quant_int4_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] W4A8 GMM+SwiGlu+Quant; V2 API may be available in op-plugin 7.3.0.

  "tensor_cast.grouped_matmul_fp8_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] FP8 GMM+SwiGlu+Quant; placeholder.

  "tensor_cast.grouped_matmul_mxfp4_swiglu.default":
    kernel_type: GroupedMatmulSwigluQuant
    notes: >
      [LOW] MXFP4 GMM+SwiGlu+Quant; placeholder.


  # ========== 5. MoE 路由 (Token Routing) ==========

  "tensor_cast.dispatch_ffn_combine.default":
    kernel_type: DispatchFFNCombine
    tc_input_count: 1
    notes: >
      [HIGH] path: C. vllm-ascend v0.15.0 超级融合 MoE op (csrc/dispatch_ffn_combine/).
      torch binding: torch.ops._C_ascend.dispatch_ffn_combine.
      aclnn: aclnnDispatchFFNCombine (INT8/W8A8) / aclnnDispatchFFNCombineBF16 (BF16).
      CANN: OP_ADD(DispatchFFNCombine) in dispatch_ffn_combine_def.cpp. Profiling: DispatchFFNCombine(928x, 35.3%).
      TC fusion pass (DispatchFFNCombinePass): replaces init_routing_v2 + grouped_matmul(×N) + unpermute_tokens
      into single fused op with args (x, expert_indices).
      TC has 2 tensor args (x, expert_indices); NPU has 7 (x, w1, w2, expert_idx, scale1, scale2, probs).
      tc_input_count=1: match on x shape (batch, hidden_size) only — weights are model-fixed.
      shape_flags: [flatten_batch — TC x is 3D (bs, seq, hidden), NPU CSV is 2D (batch, hidden)].

  "tensor_cast.init_routing_v2.default":
    kernel_type: MoeDistributeDispatchV2
    csv_file: MoeTokenPermute
    tc_input_count: 2
    alternate_kernel_types: [DispatchFFNCombine]
    notes: >
      [MEDIUM] op-plugin: MoeDistributeDispatchV2KernelOpApi.cpp.
      aclnn: aclnnMoeDistributeDispatchV2/V3/V4. EP path.
      CANN 8.5 aclgraph: 被 DispatchFFNCombine 超级融合吸收.

  "tensor_cast.unpermute_tokens.default":
    kernel_type: MoeDistributeCombineV2
    csv_file: MoeTokenUnpermute
    tc_input_count: 1
    alternate_kernel_types: [DispatchFFNCombine]
    notes: >
      [MEDIUM] op-plugin: MoeDistributeCombineKernelV2OpApi.cpp.
      aclnn: aclnnMoeDistributeCombineV2/V3/V4. EP path.
      CANN 8.5 aclgraph: 被 DispatchFFNCombine 超级融合吸收.

  "tensor_cast.moe_gating_top_k_softmax.default":
    kernel_type: MoeGatingTopK
    notes: >
      [HIGH] op-plugin: MoeGatingTopKKernelNpuOpApi.cpp.
      aclnn: aclnnMoeGatingTopK.


  # ========== 6. Attention ==========

  "tensor_cast.attention.default":
    kernel_type: FusedInferAttentionScore
    query_mode: attention_special
    notes: >
      [HIGH] op-plugin: FusedInferAttentionScoreKernelNpuOpApi.cpp.
      aclnn: aclnnFusedInferAttentionScoreV2/V3.
      Profiling: Qwen3 CANN 8.5 FusedInferAttentionScore(1920x).

  "tensor_cast.attention_quant.default":
    kernel_type: FusedInferAttentionScore
    query_mode: attention_special
    notes: >
      [HIGH] op-plugin: V1 with dequant/quant scales + V2 with quant_mode.
      aclnn: aclnnFusedInferAttentionScoreV2/V3/V4.


  # ========== 7. MLA (Multihead Latent Attention) ==========

  "tensor_cast.multihead_latent_attention.default":
    composite: true
    sub_kernels: [TransposeBatchMatMul, FusedInferAttentionScore, MatMulV2]
    notes: >
      [HIGH] MLA composite, decode/prefill 使用不同 kernel 组合 (由 decomposer 分支).
      Decode: TransposeBMM(q@W_UK_T) + FIA(attention) + TransposeBMM(out@W_UV).
      Prefill: MatMulV2(kv_c@kv_b_proj) + FusedInferAttentionScore.
      v0.18.0 变化: Prefill 不再使用 RINGMLAPrefillBF16Kernel, 统一为 FIA.

  "tensor_cast.multihead_latent_attention_quant.default":
    composite: true
    sub_kernels: [QuantBatchMatmulV3, FusedInferAttentionScore, MatMulV2]
    notes: >
      [HIGH] 量化 MLA, decode/prefill 使用不同 kernel 组合 (由 decomposer 分支).
      Decode: QuantBatchMatmulV3(q@W_UK_T) + FIA + QuantBatchMatmulV3(out@W_UV).
      Prefill: MatMulV2(kv_c@kv_b_proj) + FusedInferAttentionScore.
      v0.18.0 变化: Prefill 不再使用 RINGMLAPrefillBF16Kernel, 统一为 FIA.

  "tensor_cast.mlapo.default":
    composite: true
    sub_kernels: [MatMulV2, KvRmsNormRopeCache]
    notes: >
      [HIGH] MLAPO composite: TC fuses projection+norm+RoPE. Decomposer splits
      into 3x MatMulV2 (q_a, q_b, kv_a projections) + KvRmsNormRopeCache (post-projection
      norm+rope). Shapes derived from OpInvokeInfo.args projection weights.

  "tensor_cast.mlapo_quant.default":
    composite: true
    sub_kernels: [QuantBatchMatmulV3, KvRmsNormRopeCache]
    notes: >
      [HIGH] Quantized MLAPO composite: same decomposition, QuantBatchMatmulV3
      for projections instead of MatMulV2.


  # ========== 8. KV Cache ==========

  "tensor_cast.reshape_and_cache.default":
    kernel_type: ReshapeAndCacheNdKernel
    alternate_kernel_types: [reshape_and_cache_200000000]
    tc_input_count: 4
    notes: >
      [MEDIUM] ATB ReshapeCacheOperation → ReshapeAndCacheNdKernel.
      Profiling: Qwen3 CANN 8.5 ReshapeAndCacheNdKernel(1920x).
      TC has (key, value, cache_k, cache_v, slot_mapping); NPU CSV has 5 inputs — tc_input_count=4 to match first 4.
      v0.18.0: Decode 使用 reshape_and_cache_200000000 (Triton variant).

  "tensor_cast.concat_and_cache_mla.default":
    kernel_type: ReshapeAndCacheNdKernel
    tc_input_count: 2
    notes: >
      [LOW] ATB ReshapeAndCacheSiso. MLA KV cache; 通常被 npu_mla_prolog 吸收.
      TC has (kv_c, cache, slot_mapping, ...); NPU CSV needs first 2 (kv, cache) — tc_input_count=2.

  "tensor_cast.kv_rmsnorm_rope_cache.default":
    kernel_type: KvRmsNormRopeCache
    notes: >
      [HIGH] op-plugin: npu_kv_rmsnorm_rope_cache.
      aclnn: aclnnKvRmsNormRopeCache/V2. DSV3 only (MLA).


  # ========== 9. Norm 基础 ==========

  "tensor_cast.rms_norm.default":
    kernel_type: RmsNorm
    notes: >
      [HIGH] op-plugin: RmsNormKernelOpApi.cpp.
      aclnn: aclnnRmsNorm.
      Profiling: Qwen3 CANN 8.5 RmsNorm(90x, from 1 unfused layer + final norm).

  "tensor_cast.add_rms_norm.default":
    kernel_type: AddRmsNormBias
    alternate_kernel_types: [AddRmsNorm]
    notes: >
      [HIGH] CANN 8.5 变化: vllm-ascend v0.15.0 使用自定义 op npu_add_rms_norm_bias
      (csrc/add_rms_norm_bias/), 替代 torch_npu.npu_add_rms_norm.
      aclnn: aclnnAddRmsNormBias (支持可选 beta/bias 参数).
      Profiling: Qwen3 CANN 8.5 AddRmsNormBias(3840x).
      CANN 8.3 alternate: AddRmsNorm (aclnnAddRmsNorm).

  "tensor_cast.add_rms_norm2.default":
    kernel_type: AddRmsNormBias
    alternate_kernel_types: [AddRmsNorm]
    tc_input_count: 3
    notes: >
      [HIGH] 同 add_rms_norm, 第 3 返回值 x_out 也使用.
      CANN 8.5: AddRmsNormBias (vllm-ascend 自定义 op).
      CANN 8.3 alternate: AddRmsNorm.
      tc_input_count=3: TC has 3 tensor inputs (x, residual, weight);
      CSV AddRmsNormBias has 4 inputs (extra NPU-internal param).

  "tensor_cast.swiglu.default":
    kernel_type: SwiGlu
    notes: >
      [HIGH] op-plugin: npu_swiglu. aclnn: aclnnSwiGlu.
      Profiling: Qwen3 CANN 8.5 SwiGlu(1920x).


  # ========== 10. Norm + Static Quant 融合 ==========

  "tensor_cast.rms_norm_quant.default":
    kernel_type: RmsNormQuant
    notes: >
      [MEDIUM] op-plugin: npu_rms_norm_quant. aclnn: aclnnRmsNormQuant.

  "tensor_cast.add_rms_norm_quant.default":
    kernel_type: AddRmsNormQuant
    notes: >
      [MEDIUM] op-plugin: npu_add_rms_norm_quant. aclnn: aclnnAddRmsNormQuant/V2.

  "tensor_cast.add_rms_norm_quant2.default":
    kernel_type: AddRmsNormDynamicQuant
    alternate_kernel_types: [AddRmsNormDynamicQuantAiCore]
    tc_input_count: 3
    notes: >
      [MEDIUM] 同 add_rms_norm_quant; '2' 使用 residual.
      CANN 8.5: AddRmsNormDynamicQuant (原 AddRmsNormQuant CSV 不存在).
      tc_input_count=3: TC has 3 tensor inputs (x, residual, weight);
      CSV has additional NPU-internal params.


  # ========== 11. Norm + Dynamic Quant Symmetric ==========

  "tensor_cast.rms_norm_dynamic_quant_symmetric.default":
    composite: true
    sub_kernels: [RmsNorm, DynamicQuant]
    notes: >
      [HIGH] 无 fused aclnn; 分解为 aclnnRmsNorm + aclnnDynamicQuantV2.

  "tensor_cast.add_rms_norm_dynamic_quant_symmetric.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [MEDIUM] op-plugin: npu_add_rms_norm_dynamic_quant.
      aclnn: aclnnAddRmsNormDynamicQuantV2.

  "tensor_cast.add_rms_norm_dynamic_quant2_symmetric.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [MEDIUM] 同上; '2' 使用 residual.


  # ========== 12. Norm + Dynamic Quant Asymmetric ==========

  "tensor_cast.rms_norm_dynamic_quant_asymmetric.default":
    composite: true
    sub_kernels: [RmsNorm, DynamicQuant]
    notes: >
      [HIGH] 无 fused kernel; aclnnRmsNorm + aclnnDynamicQuantV2 (with offset).

  "tensor_cast.add_rms_norm_dynamic_quant_asymmetric.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [MEDIUM] op-plugin: npu_add_rms_norm_dynamic_quant. aclnn: aclnnAddRmsNormDynamicQuantV2.

  "tensor_cast.add_rms_norm_dynamic_quant2_asymmetric.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [MEDIUM] 同上; '2' 使用 residual.


  # ========== 13. Norm + Dynamic Quant MXFP4 ==========

  "tensor_cast.rms_norm_dynamic_quant_mxfp4.default":
    composite: true
    sub_kernels: [RmsNorm]
    notes: >
      [LOW] RmsNorm + MXFP4 quant 分解; MXFP4 部分可能用 npu_dynamic_block_quant.

  "tensor_cast.add_rms_norm_dynamic_quant_mxfp4.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [LOW] AddRmsNormBias + MXFP4 quant 分解.
      CANN 8.5: sub_kernel 更新为 AddRmsNormBias (从 AddRmsNorm).

  "tensor_cast.add_rms_norm_dynamic_quant2_mxfp4.default":
    kernel_type: AddRmsNormDynamicQuant
    notes: >
      [LOW] 同上; '2' 使用 residual.


  # ========== 14. 量化 (Quantization) ==========

  "tensor_cast.quantize.default":
    kernel_type: AscendQuantV2
    alternate_kernel_types: [AscendQuantV2Aicore]
    tc_input_count: 1
    notes: >
      [HIGH] op-plugin: npu_quantize → aclnnAscendQuant/V3.
      TC has (tensor, scale, zero_point); NPU kernel takes 1 tensor input (scale/zp are params).

  "tensor_cast.dynamic_quantize_symmetric.default":
    kernel_type: DynamicQuant
    notes: >
      [HIGH] op-plugin: npu_dynamic_quant → aclnnDynamicQuant/V2.

  "tensor_cast.dynamic_quantize_asymmetric.default":
    kernel_type: DynamicQuant
    notes: >
      [HIGH] op-plugin: npu_dynamic_quant_asymmetric → aclnnDynamicQuantV2 (with offset).

  "tensor_cast.dynamic_quantize_mxfp4.default":
