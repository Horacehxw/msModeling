# Qwen3-specific Decomposition Overrides
#
# Extends default.yaml with Qwen3-specific kernel decompositions.
# Merged at load time: default + qwen3.

version: "2.0"

decompositions:
  # Qwen3-specific fused kernel: QKV split + Q/K RmsNorm + RoPE
  # In TensorCast, this decomposes to three linear projections (Q, K, V),
  # a split, and RoPE rotation operations.
  split_qkv_rmsnorm_rope_kernel:
    tc_ops: ["aten.mm", "aten.mm", "aten.mm", "aten.split", "aten.neg", "aten.clone"]

  # Qwen3 uses standard attention, not MLA
  FusedInferAttentionScore:
    tc_ops: ["tensor_cast.attention"]
  ReshapeAndCacheNdKernel:
    tc_ops: ["tensor_cast.reshape_and_cache"]
