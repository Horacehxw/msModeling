# Default Decomposition Mappings for Order-Based Comparison (v2)
#
# This file defines how VLLM fused kernels decompose into ordered sequences
# of TensorCast operations. Used by the sequence matcher algorithm.
#
# Each decomposition entry maps a VLLM op_type to the exact ordered list of
# TC ops it should consume when walking the trace in execution order.

version: "2.0"

decompositions:
  # === Normalization fusions ===
  AddRmsNorm:
    tc_ops: ["aten.add", "aten.pow", "aten.mean", "aten.rsqrt"]
  InplaceAddRmsNorm:
    tc_ops: ["aten.add", "aten.pow", "aten.mean", "aten.rsqrt"]
  RmsNorm:
    tc_ops: ["aten.pow", "aten.mean", "aten.rsqrt"]

  # === Linear operations ===
  MatMulV2:
    tc_ops: ["aten.mm"]
  MatMul:
    tc_ops: ["aten.mm"]
  QuantBatchMatmulV3:
    tc_ops: ["tensor_cast.static_quant_linear"]

  # === Attention ===
  FusedInferAttentionScore:
    tc_ops: ["tensor_cast.attention"]
  ReshapeAndCacheNdKernel:
    tc_ops: ["tensor_cast.reshape_and_cache"]

  # === Activation ===
  SwiGlu:
    tc_ops: ["aten.silu", "aten.mul"]
  DequantSwigluQuant:
    tc_ops: ["aten.silu", "aten.mul"]

  # === Communication ===
  hcom_allReduce_:
    tc_ops: ["tensor_cast.all_reduce"]
  hcom_allGather_:
    tc_ops: ["tensor_cast.all_gather"]
  AllReduce:
    tc_ops: ["tensor_cast.all_reduce"]
  AllGather:
    tc_ops: ["tensor_cast.all_gather"]
  HcomAllGather:
    tc_ops: ["tensor_cast.all_gather"]

  # === Quantization ===
  AscendQuantV2:
    tc_ops: ["tensor_cast.dynamic_quantize_symmetric"]
  DynamicQuant:
    tc_ops: ["tensor_cast.dynamic_quantize_symmetric"]

  # === MoE ===
  MoeDistributeDispatchV2:
    tc_ops: ["tensor_cast.permute_tokens", "tensor_cast.all_to_all"]
  GroupedMatmul:
    tc_ops: ["tensor_cast.static_quant_linear"]
  MoeDistributeCombineV2:
    tc_ops: ["tensor_cast.all_to_all", "tensor_cast.unpermute_tokens"]

  # === KV Cache (MLA models) ===
  KvRmsNormRopeCache:
    tc_ops: ["tensor_cast.concat_and_cache_mla"]

# === VLLM ops to ignore (overhead, not simulated) ===
ignored_vllm_ops:
  - TensorMove
  - Fill
  - Cast
  - Sub
  - GatherV2
  - GatherV3
  - GreaterEqual
  - Less
  - LogicalAnd
  - LogicalNot
  - Mul
  - MaskedFill
  - Memset
  - Range
  - Neg
  - Slice
  - Reshape
  - Transpose
  - ConcatD
  - Concat
  - SplitVD
  - BroadcastTo
  - Equal
  - ZerosLike
  - Index
  - PadV3
  - AutomaticBufferFusionOp
  - PagedCacheLoadNdKernel

# === TC ops to ignore (zero-time views, allocations, markers) ===
ignored_tc_ops:
  - aten.empty
  - aten.view
  - aten.reshape
  - aten.squeeze
  - aten.unsqueeze
  - aten.expand
  - aten.contiguous
  - aten.zeros
  - aten.ones
  - aten.full
  - aten.slice
  - aten._to_copy
  - _internal_mark_region_begin
  - _internal_mark_region_end
