#
# 鏄犲皠楠岃瘉鏉ユ簮:
#   - DSV3 Decode Profiling (32 鍗?: hcom_allReduce_(82x), HcomAllGather(164x),
#     HcomReduceScatter(82x), hcom_alltoallv_(82x), hcom_allGather_(41x), allgatherAicpuKernel(41x)
#   - Qwen3-30B Prefill Profiling (16 鍗?: hcom_allReduce_(276x), hcom_allGather_(8x)
#   - op-plugin: 浠呮湁 fused MC2 鍙樹綋 (npu_mm_all_reduce_base, npu_all_gather_base_mm 绛?
