device: ATLAS_800_A3_752T_128G_DIE
cann_version: "8.1.RC1"
collection_date: "2026-03-04"

# ============================================================================
#                             鎷撴墤 (Topology)
# ============================================================================
# ATLAS 800 A3: grid_shape 缁村害浠庡鍒板唴 [pod 鏁? node/pod, die/node]

topology:
  grid_shape: [48, 8, 2]
  tiers:
    0: {name: "inter_pod", bandwidth_gbps: 196, latency_us: 5.5, type: "CLOS"}
    1: {name: "intra_pod", bandwidth_gbps: 196, latency_us: 0.5, type: "CLOS"}
    2: {name: "die_level", bandwidth_gbps: 224, latency_us: 0.2, type: "SIO"}


# ============================================================================
#                  閫氫俊绠楀瓙鏄犲皠 (comm_operator_mappings)
# ============================================================================
# 鍩轰簬 Profiling 瀹為檯瑙傚療鍒扮殑 HCCL kernel type
# kernel_type_variants 鍒楀嚭鍚屼竴閫昏緫鎿嶄綔鐨勪笉鍚?NPU kernel 鍚嶇О鍙樹綋

comm_operator_mappings:

  "tensor_cast.all_reduce.default":
    kernel_type: hcom_allReduce_
    notes: >
      [HIGH] HCCL direct; standalone all_reduce.
      MC2 fused npu_mm_all_reduce_base 涓嶄骇鐢熺嫭绔?hcom_allReduce_.
      Profiling: DSV3(82x), Qwen3(276x) 鈥?鍞竴瑙傚療鍒扮殑鍙樹綋.
    hccl_test_op: allreduce

  "tensor_cast.all_gather.default":
    kernel_type: hcom_allGather_
    notes: >
      [MEDIUM] HCCL direct; 涓夌 profiling 鍙樹綋:
      hcom_allGather_(41x DSV3, 8x Qwen3, standalone PyTorch dispatch),
      HcomAllGather(164x DSV3, graph-compiled torchair, 鍙兘鏉ヨ嚜 MC2 pipeline 鍒嗙墖),
      allgatherAicpuKernel(41x DSV3, AICPU 鍗忚皟璺緞, MC2 ai_cpu comm_mode).
      TC standalone all_gather 鈫?hcom_allGather_; 鑱氬悎鏌ヨ鏃跺簲鍖呭惈鎵€鏈夊彉浣?
    hccl_test_op: allgather

  "tensor_cast.reduce_scatter.default":
    kernel_type: HcomReduceScatter
    notes: >
      [MEDIUM] HCCL direct; DSV3 浠呰 HcomReduceScatter(82x, CamelCase = graph-compiled torchair);
      hcom_reduceScatter_(snake_case) 鍙兘鍦ㄩ潪 torchair 鍦烘櫙鍑虹幇.
      Qwen3 Prefill 鏃?reduce_scatter (浣跨敤 all_reduce for TP).
    hccl_test_op: reducescatter

  "tensor_cast.all_to_all.default":
    kernel_type: hcom_alltoallv_
    notes: >
      [HIGH] HCCL direct; TC 浣跨敤 variable split sizes 鈫?alltoallv (闈?fixed alltoall).
      op-plugin 鏈夎瀺鍚?npu_gmm_alltoallv (aclnnGroupedMatMulAlltoAllv), TC 鐙珛寤烘ā.
      Profiling: DSV3 Decode hcom_alltoallv_(82x = 2x41 MoE layers, dispatch+combine 鍚勪竴娆?.
    hccl_test_op: alltoall


