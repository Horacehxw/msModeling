# comm_config.yaml — 通信配置表
# 路径: tensor_cast/performance_model/perf_database/data/{device}/hccl/{cann_version}/comm_config.yaml
#
# 数据来源:
#   - DSV3 Decode Profiling: 32 卡, hcom_allReduce_ (82x), HcomAllGather (164x),
#     HcomReduceScatter (82x), hcom_alltoallv_ (82x), hcom_allGather_ (41x),
#     allgatherAicpuKernel (41x)
#   - Qwen3-30B Prefill Profiling: 16 卡, hcom_allReduce_ (276x), hcom_allGather_ (8x)
#   - HCCL Test 工具文档: https://www.hiascend.com/document/detail/zh/mindstudio/70RC1/mscommandtoolug/mscommandug/auxiliarydevtool_0017.html

device: ATLAS_800_A3_752T_128G_DIE
cann_version: "8.1.RC1"
collection_date: "2026-03-04"

# ============================================================================
#                             拓扑 (Topology)
# ============================================================================
# ATLAS 800 A3 拓扑: 48 nodes × 8 dies/node × 2 die-halves
# 三层通信层级: inter_pod (跨 pod) → intra_pod (pod 内跨 node) → die_level (node 内 die 间)
#
# 参考:
#   - CommGrid 在 tensor_cast/device.py 中定义
#   - grid_shape 维度从外到内: [pod 数, node/pod, die/node]

topology:
  grid_shape: [48, 8, 2]
  tiers:
    0:
      name: "inter_pod"
      bandwidth_gbps: 196
      latency_us: 5.5
      type: "CLOS"
      notes: "跨 pod 通信；CLOS 网络拓扑"
    1:
      name: "intra_pod"
      bandwidth_gbps: 196
      latency_us: 0.5
      type: "CLOS"
      notes: "Pod 内跨 node 通信"
    2:
      name: "die_level"
      bandwidth_gbps: 224
      latency_us: 0.2
      type: "SIO"
      notes: "Node 内 die 间直连 (SIO)"


# ============================================================================
#                  通信算子映射 (comm_operator_mappings)
# ============================================================================
# TensorCast 通信算子 → HCCL kernel type
# 同一逻辑操作可能有多个 NPU kernel 变体（见 kernel_variants）

comm_operator_mappings:

  "tensor_cast.all_reduce.default":
    kernel_type: hcom_allReduce_
    # DSV3: 82x, Qwen3: 276x — 所有 TP 场景的主要通信算子
    kernel_variants:
      - hcom_allReduce_
    hccl_test_command: "hccl_test -b 1K -e 1G -f 2 -p allreduce"

  "tensor_cast.all_gather.default":
    kernel_type: HcomAllGather
    # DSV3: HcomAllGather (164x), hcom_allGather_ (41x), allgatherAicpuKernel (41x)
    kernel_variants:
      - HcomAllGather
      - hcom_allGather_
      - allgatherAicpuKernel
    notes: >
      三个 kernel 变体: HcomAllGather (主路径), hcom_allGather_ (替代), allgatherAicpuKernel (AICPU 回退小 tensor)。
      microbenchmark 应覆盖主路径 HcomAllGather。
    hccl_test_command: "hccl_test -b 1K -e 1G -f 2 -p allgather"

  "tensor_cast.reduce_scatter.default":
    kernel_type: HcomReduceScatter
    # DSV3: HcomReduceScatter (82x)
    kernel_variants:
      - HcomReduceScatter
      - hcom_reduceScatter_
    hccl_test_command: "hccl_test -b 1K -e 1G -f 2 -p reducescatter"

  "tensor_cast.all_to_all.default":
    kernel_type: hcom_alltoallv_
    # DSV3: hcom_alltoallv_ (82x) — EP MoE variable-length token routing
    kernel_variants:
      - hcom_alltoallv_
      - hcom_alltoall_
    notes: >
      DSV3 MoE 使用 variable-length all-to-all (alltoallv)，因为每个 expert 的 token 数不固定。
      hcom_alltoall_ 为 fixed-length 变体。
    hccl_test_command: "hccl_test -b 1K -e 1G -f 2 -p alltoall"


# ============================================================================
#              通信性能参考 (Performance Reference)
# ============================================================================
# 从 Profiling 数据推算的参考值，用于 fallback analytic model 校准
# 注意: 这些是观测值而非理论峰值，包含调度开销和网络拥塞

performance_reference:

  # --- All-Reduce ---
  # Qwen3-30B Prefill (16卡 TP): 276 次 all-reduce
  # 典型 message size: 隐藏层大小 × batch × dtype_bytes
  # Qwen3-32B hidden_size=5120, BF16: ~10KB-40KB per all-reduce
  all_reduce:
    typical_scenario: "Qwen3-32B Prefill TP=16"
    num_devices: 16
    dtype: BF16
    notes: "Qwen3 Prefill 以 all-reduce 为主要通信模式 (276x / 1505 total = 18%)"

  # --- All-Gather ---
  # DSV3 Decode (32卡): HcomAllGather 164 次
  # TP all-gather for output projection / MLA decompression
  all_gather:
    typical_scenario: "DSV3 Decode TP=4 within DP=8"
    num_devices: 4
    dtype: INT8
    notes: "TP 内 all-gather；主要用于 output projection 结果聚合"

  # --- Reduce-Scatter ---
  # DSV3 Decode (32卡): HcomReduceScatter 82 次
  reduce_scatter:
    typical_scenario: "DSV3 Decode TP=4"
    num_devices: 4
    dtype: INT8
    notes: "TP reduce-scatter；与 all-gather 配合实现 TP parallelism"

  # --- All-to-All (MoE EP) ---
  # DSV3 Decode (32卡): hcom_alltoallv_ 82 次
  # EP=8 within each DP group, variable token routing
  all_to_all:
    typical_scenario: "DSV3 Decode EP=8 MoE routing"
    num_devices: 8
    dtype: INT8
    notes: >
      MoE expert parallel token dispatch/combine；每层 2 次 all-to-all (dispatch + combine)。
      Message size 变化大：取决于 gating top-k 路由结果。


# ============================================================================
#             HCCL 测试工具说明 (microbenchmark collection)
# ============================================================================
# 使用 hccl_test 工具收集实测通信性能数据:
#
# 基本用法:
#   hccl_test -b <min_bytes> -e <max_bytes> -f <factor> -p <operation>
#
# 参数:
#   -b: 起始 message size (e.g., 1K)
#   -e: 结束 message size (e.g., 1G)
#   -f: 倍增因子 (e.g., 2 表示每次翻倍)
#   -p: 操作类型 (allreduce, allgather, reducescatter, alltoall)
#
# 推荐收集矩阵:
#   - 设备数: [2, 4, 8, 16, 32, 64]
#   - Message size: 1KB ~ 1GB (2x 递增)
#   - 数据类型: [BF16, FP16, INT8, FP8]
#   - 拓扑层级: die_level (2 dies), intra_pod (8 dies), inter_pod (跨 pod)
#
# 文档: https://www.hiascend.com/document/detail/zh/mindstudio/70RC1/mscommandtoolug/mscommandug/auxiliarydevtool_0017.html
